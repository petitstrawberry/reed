[package]
name = "reed"
version = "0.1.0"
edition = "2024"

[target.'cfg(target_os = "scarlet")'.dependencies]
scarlet-ui = { path = "../scarlet-ui/crates/scarlet-ui", default-features = false, features = ["std", "platform-sws"] }

[target.'cfg(not(target_os = "scarlet"))'.dependencies]
scarlet-ui = { path = "../scarlet-ui/crates/scarlet-ui", default-features = false, features = ["std", "platform-winit"] }
